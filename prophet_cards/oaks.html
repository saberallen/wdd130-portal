<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dallin H. Oaks</title>

    <style>
        body {
            background: #FFECD7;
            font-family: Arial, sans-serif;
        }

        .card {
            background: white;
            max-width: 350px;
            margin: 50px auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px #999;
            text-align: center;
        }

        h1 {
            color: #333;
        }

        img {
            width: 200px;
            border-radius: 5px;
        }

        p {
            line-height: 1.5;
            color: #444;
        }
    </style>
</head>

<body>
    <main>
        <article class="card">
            <h1>Dallin H. Oaks</h1>

            <img src="images/oaks.webp" alt="President Dallin H. Oaks">

            <p>
                Dallin H. Oaks is the President of The Church of
                Jesus Christ of Latter-day Saints.
            </p>

            <p>
                He previously served as a justice of the Utah
                Supreme Court and as a leader in the Church.
            </p>
        </article>
    </main>
</body>
</html>
